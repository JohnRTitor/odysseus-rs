name: CI

# The gate for every push and PR. Steps run in the order AGENTS.md §13 lists,
# each one failing the job before the next starts.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # rust-toolchain.toml pins the channel, so `rustup show` installs it
        # automatically; this step only adds the components CI needs on top.
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          cargo install cargo-nextest --locked

      # AGENTS.md §3: the full command with the explicit `--config`, then
      # `git diff --exit-code`. A bare `cargo fmt --check` silently ignores
      # unstable options from a config file, so it passes on code that is not
      # actually formatted the way this repo formats it.
      - name: Format
        run: |
          cargo fmt -- --config imports_granularity=One,unstable_features=true
          git diff --exit-code

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo nextest run --profile ci

      # T0008. The rules are also asserted by an integration test, so this step
      # is a second, explicit gate that names the failure directly in the CI log
      # rather than as one FAIL line among the suite.
      - name: Dependency rules
        run: cargo nextest run --profile ci --test dependency_rules

      # T0004. `cargo deny` reads only what a crate *declares* on crates.io, so it
      # cannot see the licence of a native library linked at build time --
      # `poppler-rs` declares MIT and links GPL-2.0 libpoppler. This reads the
      # committed Cargo.lock plus the vendored crate sources and fails closed when
      # a crate that compiles C is missing from tools/native-deps.toml.
      #
      # `cargo fetch --locked` first. The checker reads `build.rs` out of
      # ~/.cargo/registry/src, which a fresh runner does not have. The check does
      # NOT pass vacuously in that state -- verified: with an empty registry it
      # reports every stanza as stale and exits 1 -- but that failure mode is a
      # confusing "remove these four stanzas" error rather than the real one. The
      # fetch makes the step report what it is actually about. `--locked` so the
      # committed Cargo.lock is what gets audited; a silently-updated lockfile
      # would audit a graph nobody committed.
      - name: Fetch dependency sources
        run: cargo fetch --locked

      - name: Native licences
        run: cargo run --manifest-path tools/check-sys-licenses/Cargo.toml
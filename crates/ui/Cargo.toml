[package]
name = "odysseus-ui"
description = "The Leptos frontend: components, routes, and client state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `hydrate` is the wasm build; without it the crate is the server renderer.
# Leptos selects the whole rendering mode from these, so they cannot be inferred.
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]

[dependencies]
odysseus-domain = { workspace = true }

leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }

serde = { workspace = true, features = ["derive"] }

console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/store",
    "crates/llm",
    "crates/agent",
    "crates/tools",
    "crates/services",
    "crates/integrations",
    "crates/web",
    "crates/ui",
    "crates/ml",
    "apps/odysseus-server",
    "apps/odysseus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/odysseus-dev/odysseus"
publish = false

# Lints are defined ONCE here and inherited with `lints.workspace = true`.
# See AGENTS.md §0 N5: `clippy -D warnings` must pass before any commit.
[workspace.lints.rust]
unsafe_code = { level = "deny", priority = -1 }
missing_debug_implementations = { level = "warn", priority = -1 }
unreachable_pub = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -2 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# AGENTS.md §7: fail closed, no silent swallowing. These are library-wide denials.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# AGENTS.md §5.1: a blocking call held across an await is the classic async bug.
await_holding_lock = "deny"
# AGENTS.md §1.4: control flow must stay shallow.
collapsible_if = "deny"
collapsible_else_if = "deny"
collapsible_match = "deny"

[workspace.dependencies]
# --- internal ---
odysseus-domain = { path = "crates/domain", version = "0.1.0" }
odysseus-store = { path = "crates/store", version = "0.1.0" }
odysseus-llm = { path = "crates/llm", version = "0.1.0" }
odysseus-agent = { path = "crates/agent", version = "0.1.0" }
odysseus-tools = { path = "crates/tools", version = "0.1.0" }
odysseus-services = { path = "crates/services", version = "0.1.0" }
odysseus-integrations = { path = "crates/integrations", version = "0.1.0" }
odysseus-web = { path = "crates/web", version = "0.1.0" }
odysseus-ui = { path = "crates/ui", version = "0.1.0" }
odysseus-ml = { path = "crates/ml", version = "0.1.0" }

# --- runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# --- web ---
any_spawner = "0.3"
axum = { version = "0.8", features = ["macros", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "trace", "fs"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
futures-util = "0.3"

# --- persistence ---
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
# `fernet` defaults to the OpenSSL backend, which would put a native libssl
# dependency in a project whose goal is one self-contained binary. The
# `rustcrypto` feature uses pure-Rust AES/HMAC instead. Output is byte-identical,
# so `data/.app_key` compatibility (DATA_MIGRATION.md §6) is unaffected.
# `fernet` defaults to the OpenSSL backend, which would put a native libssl
# dependency in a project whose goal is one self-contained binary. The
# `rustcrypto` feature uses pure-Rust AES/HMAC instead. Output is byte-identical,
# so `data/.app_key` compatibility (DATA_MIGRATION.md §6) is unaffected.
# Pinned to 0.2.1: the published 0.2.2 manifest has a duplicate `[package]`
# section and fails to download.
fernet = { version = "=0.2.1", default-features = false, features = ["rustcrypto"] }

# --- serialisation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# AGENTS.md §7: thiserror in libraries, anyhow only in main and tests.
thiserror = "2"
toml = "0.9"

# --- crypto ---
bcrypt = "0.19"
getrandom = "0.3"
subtle = "2.6"
secrecy = "0.10"
# `secret_container` was never a real feature of totp-rs 6 and this declaration
# sat inert because no member crate consumed it, so the bad feature name was
# invisible until something tried to resolve it. Verified features are:
# gen_secret, otpauth, qr, serde, steam, zeroize (+ alloc, migration, std).
# `gen_secret` mints the seed, `otpauth` builds the otpauth:// URI, `zeroize`
# scrubs the seed from memory on drop. The `qr` feature is deliberately NOT
# enabled here -- `routes/auth_routes.py:258-263` renders the QR PNG, which is
# presentation and belongs in the web layer (AGENTS.md §8).
totp-rs = { version = "6", features = ["gen_secret", "otpauth", "zeroize"] }

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# --- frontend ---
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = "0.8"
leptos-use = "0.8"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }

# --- dev / test (T0005) ---
# Cargo has no inheritable `[workspace.dev-dependencies]`: a member crate's
# `workspace = true` can only resolve against `[workspace.dependencies]`, so
# test tooling has to live here. It stays out of every member's *runtime*
# dependency set because no member lists these under `[dependencies]`.
#
# Declared `default-features = false` where the defaults pull machinery this
# workspace does not use (AGENTS.md §12.3). Each entry states what it is for,
# because a dev-dependency nobody exercises is one the next tidy-up deletes.
#
# criterion   micro-benchmark harness for `docs/baseline/`. Drops `rayon`
#             (parallel benches) and `plotters` (gnuplot): the baselines are
#             single-threaded measurements and commit JSON, not charts.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "html_reports"] }
# proptest    property-based tests for the sanitizers and parsers (AGENTS.md §11:
#             port the Python token-by-token fuzz tests). Drops `fork` and
#             `timeout` — every property here is pure and in-process, so that
#             machinery would only slow the suite down.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# insta       snapshot tests for SSE event sequences (AGENTS.md §11). No
#             `yaml`/`redactions` extras: the payloads are JSON-shaped and
#             nothing here needs redaction.
insta = { version = "1", default-features = false }
# pretty_assertions  readable multi-line diffs. Drops `nightly`, which only adds
#             `std::backtrace`-based diff rendering.
pretty_assertions = { version = "1", default-features = false, features = ["std"] }
# mockall     mock trait implementations. Off the `log`/nightly backtrace paths.
mockall = { version = "0.15", default-features = false }
# tempfile    already consumed by odysseus-store and odysseus-web. `getrandom`
#             makes generated names unguessable, which matters for the
#             `chmod 0600` files the tests create.
tempfile = { version = "3", features = ["getrandom"] }
wiremock = "0.6"
tokio-test = "0.4"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Debug builds of the agent loop get very deep async stacks.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# --- cargo-leptos ---
#
# `REWRITE_PLAN.md:186` (D3) requires "No Node runtime in deployment", so
# Tailwind is compiled by cargo-leptos, which downloads and drives the standalone
# native Tailwind compiler itself rather than shelling out to `@tailwindcss/cli`.
# That is why there is no `build.rs` running a 111 MB vendored binary.
#
# This workspace is a *split* SSR/hydrate layout: the server binary is
# `apps/odysseus-server`, while the component library and the wasm hydrate entry
# point both live in `crates/ui`. cargo-leptos therefore needs `lib-package` and
# `bin-package` to be told which is which — without them it looks for a `bin`
# target in the package holding the metadata and finds none.
[[workspace.metadata.leptos]]
# Project name, as cargo-leptos reports it. Must be present even for a
# single-project workspace; the field is required, not a label.
name = "odysseus"
# The SSR library. `crates/ui/src/app.rs::App` is the root component.
lib-package = "odysseus-ui"
# The **real** server. cargo-leptos supports this split (it is the shape
# its `start-axum-workspacely` template generates): the lib of `lib-package`
# becomes the wasm front end, the bin of `bin-package` becomes the server.
# Pointing this at `odysseus-ui` instead would have cargo-leptos build a *second*
# server that duplicates the listener, bootstrap and shutdown handling.
bin-package = "odysseus-server"

# Output name. Also the basename cargo-leptos gives the compiled stylesheet, which
# is why `crates/ui/src/app.rs` references `/pkg/odysseus-ui.css`.
output-name = "odysseus-ui"

# `crates/web`'s ServeDir mounts read from here, so the paths agree by
# construction rather than by two independently-edited constants.
#
# `assets-dir` is deliberately ABSENT. cargo-leptos does not merely read that
# directory — it treats it as its own and **deletes and recreates it** as the copy
# destination, so a hand-written asset committed there is destroyed by the next
# build. Source assets therefore live in `static/` (mirroring the Python layout)
# and are served straight from the working tree; cargo-leptos owns `site/pkg`
# alone, and nothing else in `site/` is its business.
site-root = "site"
site-pkg-dir = "pkg"

# Tailwind, not a plain `style-file`: the input is `@import "tailwindcss"` and has
# to go through the Tailwind compiler. `tailwind-config-file` is deliberately
# absent — v4 is CSS-first and needs no `tailwind.config.js`, and supplying one
# makes cargo-leptos error rather than silently ignore it.
tailwind-input-file = "crates/ui/style/tailwind.css"

# cargo-leptos splits the pair the opposite way round from what the
# names suggest: `lib-features` are the features for the **wasm front**, and
# `bin-features` are for the **server binary**. Getting this backwards does not
# fail here -- it asks for `cargo build --lib --target=wasm32 --features=ssr`,
# which fails far downstream in `mio` with "This wasm target is unsupported by
# mio", a message that names neither Leptos nor cargo-leptos.
lib-features = ["hydrate"]
bin-features = ["ssr"]


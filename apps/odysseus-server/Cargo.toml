[package]
name = "odysseus-server"
description = "The single Odysseus process: one Axum server for SSR, APIs, SSE, and auth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "odysseus-server"
path = "src/main.rs"

[features]
# Forwarded from cargo-leptos, which passes `--features=ssr` when building this
# package as `bin-package`. It exists so the SSR request is an explicit edge in
# the feature graph: this binary is what serves the Leptos document, so it is the
# thing that should be asking for the SSR build of `odysseus-ui`.
default = ["ssr"]
ssr = ["odysseus-web/ssr"]

[dependencies]
odysseus-domain = { workspace = true }
odysseus-store = { workspace = true }
odysseus-web = { workspace = true }
axum = { workspace = true }
any_spawner = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
